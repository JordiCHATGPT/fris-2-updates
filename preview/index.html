<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>FRIS! 2.0 — interactieve leerstructuur</title>
<style>
:root{font-family:"Trebuchet MS",system-ui,sans-serif;color:#242b2d;background:#ebece8;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:clamp(8px,2vw,24px)}
.phone{width:min(100%,394px);min-height:750px;background:#fffdf7;border:1px solid #d7d2c8;border-radius:19px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 26px #27272712}
header{position:relative;padding:19px 20px 0;min-height:146px;overflow:hidden;background:#fffdf7}
.brand{position:relative;z-index:2;line-height:.93;display:inline-flex;flex-direction:column;transform:rotate(-3deg)}
.brand strong{font-size:43px;font-family:"Trebuchet MS",sans-serif;font-weight:900;letter-spacing:-2.5px;color:#222629}
.brand strong i{font-style:normal;color:#d73731}
.brand small{margin:4px 0 0 4px;font-size:12px;font-weight:700;letter-spacing:.3px}
.city{position:absolute;right:3px;bottom:0;width:94%;height:112px;color:#303538;pointer-events:none}
.city .accent{fill:#dcb947;stroke:#24282b}
.city .red{fill:#db554b;stroke:#24282b}
.city path,.city line,.city rect,.city circle,.city polygon{vector-effect:non-scaling-stroke}
main{flex:1;padding:13px 23px 8px}
h1{font-size:20px;letter-spacing:-.3px;margin:0 0 17px;font-weight:800}
button,select{font:inherit}button{cursor:pointer}
.home-title{font-size:14px;text-align:center;letter-spacing:1.2px;text-transform:uppercase;color:#676057;margin:6px 0 14px;font-weight:800}
.home-actions{display:grid;gap:12px;padding:0 8px}
.home-action{width:100%;min-height:63px;display:flex;align-items:center;gap:13px;border:2px solid #323332;border-radius:10px;background:#fffefa;color:#24272a;text-align:left;padding:9px 16px;font-size:21px;letter-spacing:.1px;font-weight:800;box-shadow:3px 4px 0 #e9e2d2;transform:rotate(-.5deg)}
.home-action:nth-child(2){transform:rotate(.5deg)}.home-action:nth-child(3){transform:rotate(-.3deg)}.home-action:nth-child(4){transform:rotate(.3deg)}
.home-action:hover,.home-action:focus-visible{background:#fff5d9;outline:2px solid #d8a94d;outline-offset:2px}
.home-action .symbol{color:#272b2e;width:38px}.home-action .symbol svg{width:29px;height:29px}
.home-action .chev{margin-left:auto;font-size:26px;color:#5d5d56}
.home-action:nth-child(1) .symbol{color:#b43d33}.home-action:nth-child(3) .symbol{color:#a88c26}
.cafe{width:100%;height:155px;margin-top:5px;display:block;color:#303538;pointer-events:none}
.cafe path,.cafe rect,.cafe line,.cafe circle,.cafe ellipse{vector-effect:non-scaling-stroke}
.skill{width:100%;border:1.5px solid #4c4a43;background:#fffefa;border-radius:9px;min-height:54px;margin:0 0 9px;display:flex;align-items:center;gap:13px;padding:0 13px;text-align:left;font-weight:750;color:#222c30}
.skill:hover,.skill:focus-visible{background:#fff4d8}.symbol{width:29px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.symbol svg{width:23px;height:23px}.chev{margin-left:auto;color:#76716a;font-size:22px}
.back{border:0;background:transparent;color:#4b4b46;padding:4px 0;margin-bottom:13px}
.field{display:block;width:100%;padding:12px;border-radius:8px;border:1px solid #c9c7bf;color:#252b30;background:#fff;margin:0 0 15px;min-width:0}
.subtle{padding:13px;border-radius:10px;border:1px solid #ddd7c8;background:#f8f5ed;margin:9px 0 19px}.subtle-header{display:flex;align-items:center;justify-content:space-between;gap:9px;min-height:34px}.subtle-header strong{font-size:13.5px}.setting-mode{width:134px;border:1px solid #c7c1b8;border-radius:8px;background:#fff;color:#343b41;font-size:13px;padding:7px 4px;cursor:pointer}
.extra{padding-top:14px;border-top:1px solid #ddd4c6;margin-top:13px}.extra label{display:block;font-size:12px;color:#4e5358;margin-bottom:6px}.extra .field{margin-bottom:12px}.extra .field:last-child{margin-bottom:0}
.primary{border:0;background:#313936;color:#fff;width:100%;padding:14px 16px;border-radius:10px;font-weight:700}.summary{padding:16px;border-radius:10px;background:#f5f1e7;line-height:1.9;font-size:14px}.summary strong{display:block;font-size:18px;margin-bottom:3px}.muted{color:#70736c}.note{font-size:13px;line-height:1.55;color:#66706a;margin:17px 0}
.nav{border-top:1.5px solid #b9b5a9;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 8px 12px;gap:6px;background:#fffdf7}.nav button{border:0;background:transparent;color:#686a65;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:7px 0;border-radius:8px}.nav button.active{color:#272e2b;font-weight:800;background:#f1eddf}.nav .navicon{font-size:20px}
.check-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:7px 0 12px}.check-row label{font-size:13px;color:#435469;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #e1e0d7;border-radius:8px;padding:10px 8px}.check-row input{accent-color:#ad3933}.tiny{font-size:11px;color:#777b74;margin:7px 0 0}[hidden]{display:none!important}
@media(max-width:420px){body{padding:0}.phone{border:0;border-radius:0;box-shadow:none;min-height:100dvh}header{min-height:143px}.cafe{height:clamp(115px,19vh,160px)}}
</style>
</head>
<body>
<div class="phone">
<header><div class="brand"><strong>FRIS<i>!</i></strong><small>je Duits op</small></div><svg class="city" viewBox="0 0 350 120" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M3 115H347M15 114V83h27v31M21 83V75h15v8M25 75V68h8v7M19 91h7m6 0h6M23 104h12"/>
<path d="M50 115V87h30v28M54 87V80h22v7M58 93h5m7 0h5m-17 10h5m7 0h5M63 115v-8h6v8"/>
<path d="M93 114V64h40v50M101 64V55h24v9M109 55V46h8v9M99 75h28M99 85h28M99 95h28M103 109v-9h8v9m7 0v-9h9v9"/>
<path d="M147 115V91l8-8v-8h53v8l8 8v24M154 91h55M162 91V76m8 15V76m8 15V76m8 15V76m8 15V76m8 15V76M159 115V99h47v16M166 114v-15m33 15V99M151 75h59M148 83h65"/>
<path d="M227 115V88h25v27M229 88v-9h21v9M235 79v-7h8v7M234 96h11m-11 10h11"/>
<path d="M277 115V53m-13 0h26M277 53V18M268 25h18l5 7h-28zM275 18V6M264 34h26l5 8h-36zM274 42v12m5-12v12M262 53h29M265 53v10m22-10v10"/>
<circle class="red" cx="277" cy="18" r="5"/><path d="M301 115V89h33v26M305 89v-8h25v8M309 81V69h17v12M312 69l5-7 6 7M309 98h5m8 0h5m-18 9h5m8 0h5"/>
<path d="M4 115q4-8 8 0m28 0q4-12 8 0m35 0q5-8 9 0m126 0q4-9 9 0m25 0q4-12 9 0m72 0q6-8 11 0"/>
<path class="accent" d="M160 101h8v13h-8zM195 101h8v13h-8z"/>
</svg></header>
<main id="content" aria-live="polite"></main>
<nav class="nav" aria-label="Onderste navigatie">
  <button type="button" data-nav="home" class="active"><span class="navicon">⌂</span>Home</button>
  <button type="button" data-nav="progress"><span class="navicon">▥</span>Voortgang</button>
  <button type="button" data-nav="settings"><span class="navicon">⚙</span>Instellingen</button>
</nav>
</div>
<script>
(()=>{
'use strict';
const iconPaths={
  book:'<path d="M12 7v14"/><path d="M3 18V5a2 2 0 0 1 2-2h3a4 4 0 0 1 4 4v14a4 4 0 0 0-4-4H4a1 1 0 0 1-1-1z"/><path d="M21 18V5a2 2 0 0 0-2-2h-3a4 4 0 0 0-4 4v14a4 4 0 0 1 4-4h4a1 1 0 0 0 1-1z"/>',
  headphones:'<path d="M3 14v-3a9 9 0 0 1 18 0v3"/><path d="M6 14H5a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v-7Z"/><path d="M18 14h1a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-1v-7Z"/>',
  mic:'<rect x="8" y="2" width="8" height="13" rx="4"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/><path d="M8 22h8"/>',
  pencil:'<path d="M15 5 19 9"/><path d="M4 20l4-.5L19.5 8a2.12 2.12 0 0 0-3-3L5 16.5 4 20Z"/>',
  shuffle:'<path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h2.5a6 6 0 0 0 5.5-4l4-8a6 6 0 0 1 5.5-4H22"/><path d="M2 6h2.5a6 6 0 0 1 5.5 4l4 8a6 6 0 0 0 5.5 4H22"/>'
};
function skillIcon(key){return '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(iconPaths[key]||'')+'</svg>';}
const skills=[['Lezen','book'],['Luisteren','headphones'],['Spreken','mic'],['Schrijven','pencil'],['Gemengd','shuffle']];
const config={
  Lezen:{label:'Tekstsoort',items:['Alle teksten','Berichten en e-mails','Borden en instructies','Artikelen en informatie','Verhalen en chats'],methodLabel:'Begrip oefenen',methods:['Automatisch','Hoofdlijn begrijpen','Informatie zoeken','Details begrijpen','Betekenis afleiden'],sample:'Je leest een korte Duitse tekst en beantwoordt vragen over de inhoud. Je hoeft hem niet letterlijk te vertalen.'},
  Luisteren:{label:'Fragmentsoort',items:['Alle fragmenten','Gesprekken','Omroepen en aanwijzingen','Telefoon en voicemail','Verhalen en uitleg'],methodLabel:'Luisterdoel',methods:['Automatisch','Hoofdlijn begrijpen','Gerichte informatie horen','Details begrijpen','Instructies volgen'],sample:'Je luistert naar Duits en laat zien wat je hebt begrepen. Herhalen of langzamer luisteren kan afhankelijk zijn van je niveau.'},
  Spreken:{label:'Situatie',items:['Alle situaties','Dagelijks leven','Winkelen en horeca','Reizen en onderweg','Afspraken en hulp','Vrije gesprekken'],methodLabel:'Spreekvorm',methods:['Automatisch','Kort reageren','Vragen stellen','Rollenspel','Vrijuit vertellen','Uitspraak oefenen'],sample:'Je voert een korte dialoog in een herkenbare situatie. Je antwoordt in het Duits; de app helpt indien nodig.'},
  Schrijven:{label:'Schrijfdoel',items:['Alle schrijfdoelen','Korte antwoorden','Berichten en e-mails','Iets beschrijven','Vragen en verzoeken','Een mening geven','Vertalen NL → DE'],methodLabel:'Schrijfvorm',methods:['Automatisch','Woorden aanvullen','Zinnen ordenen','Schrijven met hulp','Zelfstandig schrijven','Vrij vertalen'],sample:'Je leert eerst bouwen met hulp en formuleert daarna steeds zelfstandiger. Correcte alternatieve zinnen mogen niet onterecht fout worden gerekend.'},
  Gemengd:{label:'Trainingsdoel',items:['Evenwichtig oefenen','Dagelijks Duits','Mijn aandachtspunten','Herhalen'],methodLabel:'Verdeling',methods:['Automatisch','Gelijk verdeeld','Meer begrijpen','Meer produceren'],sample:'Lezen, luisteren, spreken en schrijven wisselen elkaar af. De voortgang blijft per vaardigheid gescheiden.'}
};
const situations={
 'Dagelijks leven':['Alle situaties','Kennismaken','Familie en vrienden','Hobby’s','Een gesprek beginnen'],
 'Winkelen en horeca':['Alle situaties','Supermarkt','Restaurant of café','Kleding kopen','Iets bestellen'],
 'Reizen en onderweg':['Alle situaties','Hotel','Openbaar vervoer','De weg vragen','Op vakantie'],
 'Afspraken en hulp':['Alle situaties','Een afspraak maken','Telefoneren','Hulp vragen','Een probleem uitleggen'],
 'Vrije gesprekken':['Alle situaties','Vragen beantwoorden','Een mening geven','Een gesprek gaande houden']
};
const defaults={Lezen:'Alle teksten',Luisteren:'Alle fragmenten',Spreken:'Alle situaties',Schrijven:'Alle schrijfdoelen',Gemengd:'Evenwichtig oefenen'};
const storageKey='fris2-v5-profile:Jordi';
const activeProfile='Jordi';
const defaultsForState=()=>({screen:'home',skill:'Lezen',mode:'Automatisch',level:'Automatisch',method:'Automatisch',choices:{...defaults},category:'Alle situaties',situation:'Alle situaties',selectedSkills:['Lezen','Luisteren','Spreken','Schrijven']});
let state=defaultsForState();
try {
 const saved=JSON.parse(localStorage.getItem(storageKey)||'null');
 if(saved && typeof saved==='object' && skills.some(s=>s[0]===saved.skill)){
  state={...state,...saved,choices:{...defaults,...saved.choices},screen:'home'};
 }
} catch {}
const content=document.getElementById('content');
function esc(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function options(items,value){return items.map(x=>`<option value="${esc(x)}"${x===value?' selected':''}>${esc(x)}</option>`).join('')}
function select(id,title,items,value,cls='field'){return `<select id="${id}" class="${cls}" aria-label="${esc(title)}">${options(items,value)}</select>`}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({...state,screen:'skills'}))}catch{}}
function area(){if(state.skill==='Spreken'){if(state.category==='Alle situaties')return 'Alle situaties';return state.situation==='Alle situaties'?state.category:state.category+' · '+state.situation}return state.choices[state.skill]}
function example(){const a=area();const s=state.skill;return `<div class="summary"><strong>${esc(s)}</strong><div>${esc(a)}</div><div class="muted">Niveau: ${esc(state.mode==='Automatisch'?'Automatisch':state.level)}</div><div class="muted">${s==='Gemengd'?'Verdeling':config[s].methodLabel}: ${esc(state.mode==='Automatisch'?'Automatisch':state.method)}</div>${s==='Gemengd'?`<div class="muted">Vaardigheden: ${esc(state.selectedSkills.join(', '))}</div>`:''}</div><p class="note">${esc(config[s].sample)}</p><p class="tiny">Navigatieschets — nog geen echte oefening of beoordeling.</p>`}
function settings(){const s=state.skill;const cfg=config[s];const mode=state.mode;
const skillchecks=s==='Gemengd'?`<label>Vaardigheden</label><div class="check-row">${skills.filter(x=>x[0]!=='Gemengd').map(([name])=>`<label><input type="checkbox" data-included="${name}"${state.selectedSkills.includes(name)?' checked':''}>${name}</label>`).join('')}</div>`:'';
const levels=['Automatisch','A1','A2','B1','B2'];
return `<section class="subtle"><div class="subtle-header"><strong>Oefeninstellingen</strong>${select('mode','Oefeninstellingen',['Automatisch','Handmatig'],mode,'setting-mode')}</div>${mode==='Handmatig'?`<div class="extra"><label for="level">Niveau</label>${select('level','Niveau',levels,state.level)}<label for="method">${esc(cfg.methodLabel)}</label>${select('method',cfg.methodLabel,cfg.methods,state.method)}${skillchecks}</div>`:''}</section>`
}
function render(){
const areaKey=['home','skills','setup','started','theory','vocabulary','review'].includes(state.screen)?'home':state.screen;
document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',areaKey===b.dataset.nav));
if(state.screen==='home'){content.innerHTML=`<div class="home-title">Wat wil je doen?</div><div class="home-actions"><button class="home-action" data-go="skills"><span class="symbol">${skillIcon('pencil')}</span>Oefenen<span class="chev">›</span></button><button class="home-action" data-go="theory"><span class="symbol">${skillIcon('book')}</span>Theorie<span class="chev">›</span></button><button class="home-action" data-go="vocabulary"><span class="symbol">${skillIcon('book')}</span>Woordenschat<span class="chev">›</span></button><button class="home-action" data-go="review"><span class="symbol">${skillIcon('shuffle')}</span>Herhaling<span class="chev">›</span></button></div><svg class="cafe" viewBox="0 0 350 150" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
<path d="M10 125q160 8 329 0M15 132q172 6 320 0" stroke="#b6aa95"/>
<path d="M26 119q6-22 7-47m0 30q-12-13-20-12m20 4q12-19 27-18m-28 6q-8-8-14-20m15 8q8-20 19-24"/>
<path d="M33 78q-8-10-17-6 6 11 17 6m0 9q11-9 22-5-11 12-22 5m-4-21q-8-13-3-22 13 8 3 22"/>
<path d="M42 52l-4-6 6-5 6 5-2 7z" fill="#dbb449"/><circle cx="44" cy="47" r="3" fill="#a84236"/>
<path d="M19 106h35l-4 23H24z" fill="#e3d0b8"/><path d="M18 106h37M28 116h16"/>
<ellipse cx="157" cy="128" rx="84" ry="8" fill="#e8e3d5" stroke="#b9b5aa"/>
<path d="M99 89h68l-5 34q-27 9-54-2z" fill="#f8f3e7"/><path d="M167 94q25-5 22 10-2 12-26 9"/><ellipse cx="133" cy="90" rx="34" ry="6" fill="#fff"/><ellipse cx="133" cy="90" rx="27" ry="4" fill="#ad7357" stroke="#6a534b"/>
<path d="M122 80q-9-8 0-17m15 17q-8-9 0-19m12 19q-8-9 0-16" stroke="#b0a99b"/>
<path d="M204 115l88-27 13 34-87 23z" fill="#f9f7ef"/><path d="M211 116l86-26M218 123l83-24M225 130l80-25" stroke="#c6c6c0"/>
<path d="M270 75l7 3-32 58-5 3 1-7z" fill="#e5c458"/><path d="M270 75l3-7 7 3-3 7z" fill="#db5047"/>
<path d="M310 115V75m0 22q-12-9-16-7m16-3q13-12 23-9m-23-5q-10-11-13-18m13 6q11-14 17-15"/>
<path d="M293 53q-4-8 2-13 8 6 4 13m24-5q5-8 12-4-3 8-12 9m-19 6q-7-5-11 1 4 6 11 4" fill="#d0d7b0"/>
<circle cx="309" cy="70" r="7" fill="#e0b63a"/><path d="M310 56v28M296 70h28M300 60l19 20m0-20-19 20" stroke="#d7a945"/>
<path d="M296 120h28l-3 12h-22z" fill="#e3d0b8"/>
</svg>`;}
else if(state.screen==='skills'){content.innerHTML=`<button class="back" data-back="home">← Terug</button><h1>Oefenen</h1>${skills.map(([s,ic])=>`<button class="skill" data-skill="${esc(s)}"><span class="symbol">${skillIcon(ic)}</span>${esc(s)}<span class="chev">›</span></button>`).join('')}`;}
else if(state.screen==='setup'){
const s=state.skill,cfg=config[s];
const first=s==='Spreken'?select('category','Situatie',cfg.items,state.category):select('choice',cfg.label,cfg.items,state.choices[s]);
const second=s==='Spreken'&&state.category!=='Alle situaties'?select('situation','Specifieke situatie',situations[state.category]||['Alle situaties'],state.situation):'';
content.innerHTML=`<button class="back" data-back="skills">← Terug</button><h1>${esc(s)}</h1>${first}${second}${settings()}<button class="primary" id="start">Start oefenen →</button>`;
}
else if(state.screen==='started'){content.innerHTML=`<button class="back" data-back="setup">← Terug</button><h1>Oefening</h1>${example()}<button class="primary" data-back="setup">Keuzes aanpassen</button>`;}
else if(['theory','vocabulary','review'].includes(state.screen)){const names={theory:'Theorie',vocabulary:'Woordenschat',review:'Herhaling'};content.innerHTML=`<button class="back" data-back="home">← Terug</button><h1>${names[state.screen]}</h1><p class="note">Deze sectie wordt in de HTML-schets verder uitgewerkt.</p>`;}
else if(state.screen==='progress'){content.innerHTML=`<h1>Voortgang</h1><p class="note">Voortgang voor ${esc(activeProfile)} komt hier. In deze schets zijn er nog geen echte oefenresultaten.</p>`;}
else if(state.screen==='settings'){content.innerHTML=`<h1>Instellingen</h1><p class="note">Je oefenkeuzes worden bewaard in deze browser.</p>`;}
persist();
}
document.addEventListener('click',ev=>{
const go=ev.target.closest('[data-go]');if(go){state.screen=go.dataset.go;render();return}
const sk=ev.target.closest('[data-skill]');if(sk){state.skill=sk.dataset.skill;state.screen='setup';state.mode='Automatisch';state.level='Automatisch';state.method='Automatisch';render();return}
const b=ev.target.closest('[data-back]');if(b){state.screen=b.dataset.back;render();return}
const nav=ev.target.closest('[data-nav]');if(nav){state.screen=nav.dataset.nav==='home'?'home':nav.dataset.nav;render();return}
if(ev.target.closest('#start')){state.screen='started';render()}
});
document.addEventListener('change',ev=>{
const id=ev.target.id,val=ev.target.value;
if(id==='mode'){state.mode=val;render();return}
if(id==='category'){state.category=val;state.situation='Alle situaties';render();return}
if(id==='situation')state.situation=val;
if(id==='choice')state.choices[state.skill]=val;
if(id==='level')state.level=val;
if(id==='method')state.method=val;
if(ev.target.dataset.included){const name=ev.target.dataset.included;if(ev.target.checked){if(!state.selectedSkills.includes(name))state.selectedSkills.push(name)}else if(state.selectedSkills.length>1){state.selectedSkills=state.selectedSkills.filter(s=>s!==name)}else{ev.target.checked=true} }
persist();
});
render();
})();
</script>
</body>
</html>
