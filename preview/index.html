<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>FRIS! 2.0 — interactieve leerstructuur</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#181818;background:#f2f0e9;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;justify-content:center;align-items:flex-start}
.phone{width:min(100%,480px);min-height:100dvh;background:#fffaf1;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 40px #0001}
button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #e8b500;outline-offset:3px}
header.hero{height:clamp(216px,58vw,282px);max-height:282px;position:relative;overflow:hidden;flex-shrink:0;background:#fffaf1}
.hero-art{width:100%;height:100%;display:block}
.brand{position:absolute;z-index:2;left:15%;top:6%;transform:rotate(-7deg);line-height:.9;white-space:nowrap}
.brand strong{font-family:Arial Black,Arial,sans-serif;font-weight:1000;font-style:italic;font-size:clamp(42px,11vw,66px);letter-spacing:-4px;text-shadow:1px 1px #222}
.brand strong i{color:#df1014;font-style:normal}.brand small{display:block;margin:4px 0 0 33%;font-family:"Segoe Print","Comic Sans MS",cursive;font-weight:900;font-style:italic;font-size:clamp(16px,5vw,24px);transform:rotate(-3deg)}.brand:before{content:"";position:absolute;top:-6px;left:-17px;width:80%;height:13px;border-top:7px solid #ffbf00;border-radius:75% 65% 0 0;transform:rotate(-6deg)}.brand:after{content:"";position:absolute;bottom:-10px;left:36%;width:64%;height:10px;border-top:5px solid #e51b23;border-radius:70% 40% 0 0;transform:rotate(-7deg)}
main{flex:1;min-height:0;padding:0;display:flex;flex-direction:column}
.home-panel{display:flex;flex-direction:column;flex:1;min-height:0}
.greeting{text-align:center;padding:7px 14px 5px}.greeting h1{font-family:"Segoe Script","Segoe Print","Brush Script MT","Comic Sans MS",cursive;font-size:clamp(34px,9vw,51px);font-style:italic;line-height:1.3;margin:0;color:#0b0b0b;font-weight:900;letter-spacing:-2px}.greeting h1:after{content:"";display:block;width:34%;border-top:5px solid #e52222;margin:-1px auto 5px;transform:rotate(-4deg);border-radius:100%}.greeting p{font-size:clamp(13px,3.5vw,17px);color:#444;margin:4px 0 0;line-height:1.4}
.home-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:18px 10px 8px;align-items:start}
.home-action{display:flex;flex-direction:column;align-items:center;min-width:0;border:0;background:transparent;color:#0b0b0b;padding:0 2px;gap:3px}
.home-action:hover .tile-illustration{transform:scale(1.055)}.home-action:active .tile-illustration{transform:scale(.97)}
.tile-illustration{width:100%;height:clamp(104px,31vw,150px);transition:transform .15s;display:block;filter:drop-shadow(1px 2px 0 #7772)}
.tile-label{font-family:"Segoe Script","Segoe Print","Brush Script MT","Comic Sans MS",cursive;font-size:clamp(21px,5.8vw,31px);font-style:italic;font-weight:900;white-space:nowrap;letter-spacing:-1px;line-height:1.3}
.tile-underline{height:5px;width:68%;border-top:5px solid #f8b900;border-radius:100%;transform:rotate(-4deg)}.home-action.red .tile-underline{border-color:#eb2629}
.progress-wrap{display:flex;align-items:center;gap:10px;padding:13px 28px 5px;margin-top:auto}
.progress-label{white-space:nowrap;font-size:clamp(12px,3.2vw,16px);color:#454545}.progress-track{flex:1;min-width:30px;height:11px;border-radius:12px;background:#d9d6d1;overflow:hidden}.progress-fill{height:100%;width:9%;background:#ffc400;border-radius:12px}.progress-value{font-weight:900;font-size:21px;min-width:42px;text-align:right}
.footer-illustration{height:clamp(130px,37vw,188px);width:100%;display:block;margin-top:5px}
.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;background:#fffaf3;border-top:1px solid #e0d5c3;padding:9px 6px max(8px,env(safe-area-inset-bottom));flex-shrink:0}
.nav button{min-width:0;border:0;background:transparent;color:#111;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0 5px;font-size:clamp(10px,2.9vw,14px);font-weight:600;position:relative}
.nav button svg{width:clamp(25px,7vw,35px);height:clamp(25px,7vw,35px);stroke:#131313;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nav button.active{color:#e11b20}.nav button.active svg{stroke:#e11b20;fill:#e11b20}.nav button.active:after{content:"";position:absolute;bottom:-4px;height:4px;width:75%;background:#e11b20;border-radius:5px}
.nav button[data-nav="progress"] svg rect:nth-child(2){fill:#f5b900;stroke:#f5b900}.nav button[data-nav="progress"] svg rect:nth-child(3){fill:#e11b20;stroke:#e11b20}
.page-inner{padding:20px 22px;flex:1}.page-inner h1{font-size:24px;margin:0 0 17px}.back{border:0;background:none;padding:5px 0 17px;color:#5d5851;font-size:15px}
.skill{width:100%;display:flex;align-items:center;gap:15px;border:1px solid #ded8cb;border-radius:12px;background:#fff;padding:13px;text-align:left;font-size:17px;font-weight:700;margin-bottom:10px;color:#292929}.skill:hover{background:#fff3d4}.symbol{width:28px;display:flex;align-items:center;justify-content:center}.symbol svg{width:26px;height:26px}.chev{margin-left:auto;font-size:25px;color:#999}
.field{width:100%;padding:12px;border:1px solid #cfcac1;border-radius:9px;background:#fff;color:#272727;margin:0 0 14px}
.subtle{border:1px solid #e6dac2;background:#fff7e9;border-radius:10px;padding:13px;margin-bottom:16px}.subtle-header{display:flex;align-items:center;justify-content:space-between;gap:10px}.subtle-header strong{font-size:14px}.setting-mode{width:130px;background:white;border:1px solid #ddd1bd;border-radius:8px;padding:7px}
.extra{padding-top:12px}.extra label{font-size:13px;color:#555;display:block;margin:8px 0}.check-row{display:grid;grid-template-columns:1fr 1fr;gap:5px}.check-row label{margin:0;padding:6px;background:#fff;border:1px solid #eee}.check-row input{accent-color:#db1d21}
.primary{background:#da1c22;color:white;width:100%;border:0;border-radius:9px;padding:14px;font-weight:700}.summary{background:#fff2d8;border-radius:10px;padding:16px;line-height:1.8}.summary strong{display:block}.muted,.note,.tiny{color:#626262}.note{font-size:14px;line-height:1.5}.tiny{font-size:12px}
@media(min-width:650px){body{padding:18px}.phone{min-height:820px;border:1px solid #e3ded4;border-radius:20px}}
@media(max-height:710px){header.hero{height:190px}.home-actions{padding-top:5px}.tile-illustration{height:100px}.footer-illustration{height:110px}.greeting h1{font-size:34px}.greeting p{font-size:13px}}
</style>
</head>
<body>

<main id="content" aria-live="polite"></main>
<nav class="nav" aria-label="Onderste navigatie"><button type="button" data-nav="home" class="active" aria-label="Home"><svg viewBox="0 0 34 34" aria-hidden="true"><path d="m4 17 14-13 14 13v14H21V20h-7v11H4z"/></svg><span>Home</span></button><button type="button" data-nav="review" class="" aria-label="Herhaling"><svg viewBox="0 0 34 34" aria-hidden="true"><path d="M3 7q7-4 14 0v25q-7-4-14 0zM17 7q7-4 14 0v25q-7-4-14 0z"/></svg><span>Herhaling</span></button><button type="button" data-nav="theory" class="" aria-label="Theorie"><svg viewBox="0 0 34 34" aria-hidden="true"><path d="m3 12 14-7 14 7-14 7zM9 17v7q8 7 16 0v-7m6-4v12"/></svg><span>Theorie</span></button><button type="button" data-nav="progress" class="" aria-label="Voortgang"><svg viewBox="0 0 34 34" aria-hidden="true"><rect x="3" y="22" width="6" height="9" rx="1"/><rect x="13" y="14" width="6" height="17" rx="1"/><rect x="23" y="6" width="6" height="25" rx="1"/></svg><span>Voortgang</span></button><button type="button" data-nav="settings" class="" aria-label="Instellingen"><svg viewBox="0 0 34 34" aria-hidden="true"><path d="M14 3h6l1 4 4 2 4-2 3 5-3 3v4l3 3-3 5-4-2-4 2-1 4h-6l-1-4-4-2-4 2-3-5 3-3v-4l-3-3 3-5 4 2 4-2z"/><circle cx="17" cy="17" r="5"/></svg><span>Instellingen</span></button></nav>
</div>
<script>
(()=>{
'use strict';
const iconPaths={
  book:'<path d="M12 7v14"/><path d="M3 18V5a2 2 0 0 1 2-2h3a4 4 0 0 1 4 4v14a4 4 0 0 0-4-4H4a1 1 0 0 1-1-1z"/><path d="M21 18V5a2 2 0 0 0-2-2h-3a4 4 0 0 0-4 4v14a4 4 0 0 1 4-4h4a1 1 0 0 0 1-1z"/>',
  headphones:'<path d="M3 14v-3a9 9 0 0 1 18 0v3"/><path d="M6 14H5a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v-7Z"/><path d="M18 14h1a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-1v-7Z"/>',
  mic:'<rect x="8" y="2" width="8" height="13" rx="4"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/><path d="M8 22h8"/>',
  pencil:'<path d="M15 5 19 9"/><path d="M4 20l4-.5L19.5 8a2.12 2.12 0 0 0-3-3L5 16.5 4 20Z"/>',
  shuffle:'<path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h2.5a6 6 0 0 0 5.5-4l4-8a6 6 0 0 1 5.5-4H22"/><path d="M2 6h2.5a6 6 0 0 1 5.5 4l4 8a6 6 0 0 0 5.5 4H22"/>'
};
function skillIcon(key){return '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(iconPaths[key]||'')+'</svg>';}
const skills=[['Lezen','book'],['Luisteren','headphones'],['Spreken','mic'],['Schrijven','pencil'],['Gemengd','shuffle']];
const config={
  Lezen:{label:'Tekstsoort',items:['Alle teksten','Berichten en e-mails','Borden en instructies','Artikelen en informatie','Verhalen en chats'],methodLabel:'Begrip oefenen',methods:['Automatisch','Hoofdlijn begrijpen','Informatie zoeken','Details begrijpen','Betekenis afleiden'],sample:'Je leest een korte Duitse tekst en beantwoordt vragen over de inhoud. Je hoeft hem niet letterlijk te vertalen.'},
  Luisteren:{label:'Fragmentsoort',items:['Alle fragmenten','Gesprekken','Omroepen en aanwijzingen','Telefoon en voicemail','Verhalen en uitleg'],methodLabel:'Luisterdoel',methods:['Automatisch','Hoofdlijn begrijpen','Gerichte informatie horen','Details begrijpen','Instructies volgen'],sample:'Je luistert naar Duits en laat zien wat je hebt begrepen. Herhalen of langzamer luisteren kan afhankelijk zijn van je niveau.'},
  Spreken:{label:'Situatie',items:['Alle situaties','Dagelijks leven','Winkelen en horeca','Reizen en onderweg','Afspraken en hulp','Vrije gesprekken'],methodLabel:'Spreekvorm',methods:['Automatisch','Kort reageren','Vragen stellen','Rollenspel','Vrijuit vertellen','Uitspraak oefenen'],sample:'Je voert een korte dialoog in een herkenbare situatie. Je antwoordt in het Duits; de app helpt indien nodig.'},
  Schrijven:{label:'Schrijfdoel',items:['Alle schrijfdoelen','Korte antwoorden','Berichten en e-mails','Iets beschrijven','Vragen en verzoeken','Een mening geven','Vertalen NL → DE'],methodLabel:'Schrijfvorm',methods:['Automatisch','Woorden aanvullen','Zinnen ordenen','Schrijven met hulp','Zelfstandig schrijven','Vrij vertalen'],sample:'Je leert eerst bouwen met hulp en formuleert daarna steeds zelfstandiger. Correcte alternatieve zinnen mogen niet onterecht fout worden gerekend.'},
  Gemengd:{label:'Trainingsdoel',items:['Evenwichtig oefenen','Dagelijks Duits','Mijn aandachtspunten','Herhalen'],methodLabel:'Verdeling',methods:['Automatisch','Gelijk verdeeld','Meer begrijpen','Meer produceren'],sample:'Lezen, luisteren, spreken en schrijven wisselen elkaar af. De voortgang blijft per vaardigheid gescheiden.'}
};
const situations={
 'Dagelijks leven':['Alle situaties','Kennismaken','Familie en vrienden','Hobby’s','Een gesprek beginnen'],
 'Winkelen en horeca':['Alle situaties','Supermarkt','Restaurant of café','Kleding kopen','Iets bestellen'],
 'Reizen en onderweg':['Alle situaties','Hotel','Openbaar vervoer','De weg vragen','Op vakantie'],
 'Afspraken en hulp':['Alle situaties','Een afspraak maken','Telefoneren','Hulp vragen','Een probleem uitleggen'],
 'Vrije gesprekken':['Alle situaties','Vragen beantwoorden','Een mening geven','Een gesprek gaande houden']
};
const defaults={Lezen:'Alle teksten',Luisteren:'Alle fragmenten',Spreken:'Alle situaties',Schrijven:'Alle schrijfdoelen',Gemengd:'Evenwichtig oefenen'};
const storageKey='fris2-v5-profile:Jordi';
const activeProfile='Jordi';
const defaultsForState=()=>({screen:'home',skill:'Lezen',mode:'Automatisch',level:'Automatisch',method:'Automatisch',choices:{...defaults},category:'Alle situaties',situation:'Alle situaties',selectedSkills:['Lezen','Luisteren','Spreken','Schrijven']});
let state=defaultsForState();
try {
 const saved=JSON.parse(localStorage.getItem(storageKey)||'null');
 if(saved && typeof saved==='object' && skills.some(s=>s[0]===saved.skill)){
  state={...state,...saved,choices:{...defaults,...saved.choices},screen:'home'};
 }
} catch {}
const content=document.getElementById('content');
function esc(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function options(items,value){return items.map(x=>`<option value="${esc(x)}"${x===value?' selected':''}>${esc(x)}</option>`).join('')}
function select(id,title,items,value,cls='field'){return `<select id="${id}" class="${cls}" aria-label="${esc(title)}">${options(items,value)}</select>`}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({...state,screen:'home'}))}catch{}}
function area(){if(state.skill==='Spreken'){if(state.category==='Alle situaties')return 'Alle situaties';return state.situation==='Alle situaties'?state.category:state.category+' · '+state.situation}return state.choices[state.skill]}
function example(){const a=area();const s=state.skill;return `<div class="summary"><strong>${esc(s)}</strong><div>${esc(a)}</div><div class="muted">Niveau: ${esc(state.mode==='Automatisch'?'Automatisch':state.level)}</div><div class="muted">${s==='Gemengd'?'Verdeling':config[s].methodLabel}: ${esc(state.mode==='Automatisch'?'Automatisch':state.method)}</div>${s==='Gemengd'?`<div class="muted">Vaardigheden: ${esc(state.selectedSkills.join(', '))}</div>`:''}</div><p class="note">${esc(config[s].sample)}</p><p class="tiny">Navigatieschets — nog geen echte oefening of beoordeling.</p>`}
function settings(){const s=state.skill;const cfg=config[s];const mode=state.mode;
const skillchecks=s==='Gemengd'?`<label>Vaardigheden</label><div class="check-row">${skills.filter(x=>x[0]!=='Gemengd').map(([name])=>`<label><input type="checkbox" data-included="${name}"${state.selectedSkills.includes(name)?' checked':''}>${name}</label>`).join('')}</div>`:'';
const levels=['Automatisch','A1','A2','B1','B2'];
return `<section class="subtle"><div class="subtle-header"><strong>Oefeninstellingen</strong>${select('mode','Oefeninstellingen',['Automatisch','Handmatig'],mode,'setting-mode')}</div>${mode==='Handmatig'?`<div class="extra"><label for="level">Niveau</label>${select('level','Niveau',levels,state.level)}<label for="method">${esc(cfg.methodLabel)}</label>${select('method',cfg.methodLabel,cfg.methods,state.method)}${skillchecks}</div>`:''}</section>`
}
function render(){
const areaKey=['home','skills','setup','started','lessons'].includes(state.screen)?'home':state.screen;
document.querySelectorAll('[data-nav]').forEach(b=>{b.classList.toggle('active',areaKey===b.dataset.nav); b.setAttribute('aria-current',areaKey===b.dataset.nav?'page':'false')});

else if(state.screen==='skills'){content.innerHTML=`<div class="page-inner"><button class="back" data-back="home">← Terug</button><h1>Oefenen</h1>${skills.map(([s,ic])=>`<button class="skill" data-skill="${esc(s)}"><span class="symbol">${skillIcon(ic)}</span>${esc(s)}<span class="chev">›</span></button>`).join('')}`;}
else if(state.screen==='setup'){
const s=state.skill,cfg=config[s];
const first=s==='Spreken'?select('category','Situatie',cfg.items,state.category):select('choice',cfg.label,cfg.items,state.choices[s]);
const second=s==='Spreken'&&state.category!=='Alle situaties'?select('situation','Specifieke situatie',situations[state.category]||['Alle situaties'],state.situation):'';
content.innerHTML=`<div class="page-inner"><button class="back" data-back="skills">← Terug</button><h1>${esc(s)}</h1>${first}${second}${settings()}<button class="primary" id="start">Start oefenen →</button></div>`;
}
else if(state.screen==='started'){content.innerHTML=`<div class="page-inner"><button class="back" data-back="setup">← Terug</button><h1>Oefening</h1>${example()}<button class="primary" data-back="setup">Keuzes aanpassen</button></div>`;}
else if(['theory','vocabulary','review','lessons'].includes(state.screen)){const names={theory:'Theorie',vocabulary:'Woordenschat',review:'Herhaling',lessons:'Lessen'};content.innerHTML=`<div class="page-inner"><button class="back" data-back="home">← Terug</button><h1>${names[state.screen]}</h1><p class="note">Dit is een klikbaar navigatievoorbeeld. De lessen en oefeningen komen uit het afzonderlijke Android-project.</p>${state.screen==='lessons'?'<button class="primary" data-go="skills">Naar oefeningen</button>':''}</div>`;}
else if(state.screen==='progress'){content.innerHTML=`<div class="page-inner"><h1>Voortgang</h1><p class="note">De 9% op het startscherm is een voorbeeld uit het ontwerp. Er zijn in deze HTML-preview nog geen echte oefenresultaten.</p></div>`;}
else if(state.screen==='settings'){content.innerHTML=`<div class="page-inner"><h1>Instellingen</h1><p class="note">Je oefenkeuzes worden bewaard in deze browser.</p></div>`;}
persist();
}
document.addEventListener('click',ev=>{
const go=ev.target.closest('[data-go]');if(go){state.screen=go.dataset.go;render();return}
const sk=ev.target.closest('[data-skill]');if(sk){state.skill=sk.dataset.skill;state.screen='setup';state.mode='Automatisch';state.level='Automatisch';state.method='Automatisch';render();return}
const b=ev.target.closest('[data-back]');if(b){state.screen=b.dataset.back;render();return}
const nav=ev.target.closest('[data-nav]');if(nav){state.screen=nav.dataset.nav==='home'?'home':nav.dataset.nav;render();return}
if(ev.target.closest('#start')){state.screen='started';render()}
});
document.addEventListener('change',ev=>{
const id=ev.target.id,val=ev.target.value;
if(id==='mode'){state.mode=val;render();return}
if(id==='category'){state.category=val;state.situation='Alle situaties';render();return}
if(id==='situation')state.situation=val;
if(id==='choice')state.choices[state.skill]=val;
if(id==='level')state.level=val;
if(id==='method')state.method=val;
if(ev.target.dataset.included){const name=ev.target.dataset.included;if(ev.target.checked){if(!state.selectedSkills.includes(name))state.selectedSkills.push(name)}else if(state.selectedSkills.length>1){state.selectedSkills=state.selectedSkills.filter(s=>s!==name)}else{ev.target.checked=true} }
persist();
});
render();
})();
