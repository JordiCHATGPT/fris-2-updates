  Luisteren:{label:'Fragmentsoort',items:['Alle fragmenten','Gesprekken','Omroepen en aanwijzingen','Telefoon en voicemail','Verhalen en uitleg'],methodLabel:'Luisterdoel',methods:['Automatisch','Hoofdlijn begrijpen','Gerichte informatie horen','Details begrijpen','Instructies volgen'],sample:'Je luistert naar Duits en laat zien wat je hebt begrepen. Herhalen of langzamer luisteren kan afhankelijk zijn van je niveau.'},
  Spreken:{label:'Situatie',items:['Alle situaties','Dagelijks leven','Winkelen en horeca','Reizen en onderweg','Afspraken en hulp','Vrije gesprekken'],methodLabel:'Spreekvorm',methods:['Automatisch','Kort reageren','Vragen stellen','Rollenspel','Vrijuit vertellen','Uitspraak oefenen'],sample:'Je voert een korte dialoog in een herkenbare situatie. Je antwoordt in het Duits; de app helpt indien nodig.'},
  Schrijven:{label:'Schrijfdoel',items:['Alle schrijfdoelen','Korte antwoorden','Berichten en e-mails','Iets beschrijven','Vragen en verzoeken','Een mening geven','Vertalen NL → DE'],methodLabel:'Schrijfvorm',methods:['Automatisch','Woorden aanvullen','Zinnen ordenen','Schrijven met hulp','Zelfstandig schrijven','Vrij vertalen'],sample:'Je leert eerst bouwen met hulp en formuleert daarna steeds zelfstandiger. Correcte alternatieve zinnen mogen niet onterecht fout worden gerekend.'},
  Gemengd:{label:'Trainingsdoel',items:['Evenwichtig oefenen','Dagelijks Duits','Mijn aandachtspunten','Herhalen'],methodLabel:'Verdeling',methods:['Automatisch','Gelijk verdeeld','Meer begrijpen','Meer produceren'],sample:'Lezen, luisteren, spreken en schrijven wisselen elkaar af. De voortgang blijft per vaardigheid gescheiden.'}
};
const situations={
 'Dagelijks leven':['Alle situaties','Kennismaken','Familie en vrienden','Hobby’s','Een gesprek beginnen'],
 'Winkelen en horeca':['Alle situaties','Supermarkt','Restaurant of café','Kleding kopen','Iets bestellen'],
 'Reizen en onderweg':['Alle situaties','Hotel','Openbaar vervoer','De weg vragen','Op vakantie'],
 'Afspraken en hulp':['Alle situaties','Een afspraak maken','Telefoneren','Hulp vragen','Een probleem uitleggen'],
 'Vrije gesprekken':['Alle situaties','Vragen beantwoorden','Een mening geven','Een gesprek gaande houden']
};
const defaults={Lezen:'Alle teksten',Luisteren:'Alle fragmenten',Spreken:'Alle situaties',Schrijven:'Alle schrijfdoelen',Gemengd:'Evenwichtig oefenen'};
const storageKey='fris2-v5-profile:Jordi';
const activeProfile='Jordi';
const defaultsForState=()=>({screen:'home',skill:'Lezen',mode:'Automatisch',level:'Automatisch',method:'Automatisch',choices:{...defaults},category:'Alle situaties',situation:'Alle situaties',selectedSkills:['Lezen','Luisteren','Spreken','Schrijven']});
let state=defaultsForState();
try {
 const saved=JSON.parse(localStorage.getItem(storageKey)||'null');
 if(saved && typeof saved==='object' && skills.some(s=>s[0]===saved.skill)){
  state={...state,...saved,choices:{...defaults,...saved.choices},screen:'home'};
 }
} catch {}
const content=document.getElementById('content');
function esc(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function options(items,value){return items.map(x=>`<option value="${esc(x)}"${x===value?' selected':''}>${esc(x)}</option>`).join('')}
function select(id,title,items,value,cls='field'){return `<select id="${id}" class="${cls}" aria-label="${esc(title)}">${options(items,value)}</select>`}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({...state,screen:'home'}))}catch{}}
function area(){if(state.skill==='Spreken'){if(state.category==='Alle situaties')return 'Alle situaties';return state.situation==='Alle situaties'?state.category:state.category+' · '+state.situation}return state.choices[state.skill]}
function example(){const a=area();const s=state.skill;return `<div class="summary"><strong>${esc(s)}</strong><div>${esc(a)}</div><div class="muted">Niveau: ${esc(state.mode==='Automatisch'?'Automatisch':state.level)}</div><div class="muted">${s==='Gemengd'?'Verdeling':config[s].methodLabel}: ${esc(state.mode==='Automatisch'?'Automatisch':state.method)}</div>${s==='Gemengd'?`<div class="muted">Vaardigheden: ${esc(state.selectedSkills.join(', '))}</div>`:''}</div><p class="note">${esc(config[s].sample)}</p><p class="tiny">Navigatieschets — nog geen echte oefening of beoordeling.</p>`}
function settings(){const s=state.skill;const cfg=config[s];const mode=state.mode;
const skillchecks=s==='Gemengd'?`<label>Vaardigheden</label><div class="check-row">${skills.filter(x=>x[0]!=='Gemengd').map(([name])=>`<label><input type="checkbox" data-included="${name}"${state.selectedSkills.includes(name)?' checked':''}>${name}</label>`).join('')}</div>`:'';
const levels=['Automatisch','A1','A2','B1','B2'];
return `<section class="subtle"><div class="subtle-header"><strong>Oefeninstellingen</strong>${select('mode','Oefeninstellingen',['Automatisch','Handmatig'],mode,'setting-mode')}</div>${mode==='Handmatig'?`<div class="extra"><label for="level">Niveau</label>${select('level','Niveau',levels,state.level)}<label for="method">${esc(cfg.methodLabel)}</label>${select('method',cfg.methodLabel,cfg.methods,state.method)}${skillchecks}</div>`:''}</section>`
}

// Rescale only soft watercolour bands; menu illustrations and lettering retain their proportions.
// This adapts the approved 1024 x 1536 artwork to a tall phone without cropping the sides.
const frisArt=new Image();
frisArt.src='../art/fris-approved-watercolor.webp';
frisArt.addEventListener('load',drawHomeCanvas);
// The artwork is never stretched: only four quiet paper-texture bands grow.
const frisStops=[475,660,835,1010];
const frisWeights=[.13,.26,.26,.35];
function frisGeometry(designHeight){
 const extra=Math.max(0,designHeight-1536);
 const gaps=frisWeights.map(weight=>weight*extra);
 const mappedY=y=>y+frisStops.reduce((n,stop,i)=>n+(y>=stop?gaps[i]:0),0);
 return {gaps,mappedY,renderHeight:1536+extra};
}
function drawHomeCanvas(){
 const canvas=document.getElementById('fris-home-canvas');
 if(!canvas||!frisArt.complete||!frisArt.naturalWidth)return;
 const shell=canvas.closest('.fris-full-composition');
 if(!shell)return;
 const width=shell.clientWidth;
 const viewHeight=shell.clientHeight;
 if(width<1||viewHeight<1)return;
 const designHeight=Math.max(1536,viewHeight/width*1024);
 const naturalHeight=width*designHeight/1024;
 const dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.style.height=naturalHeight+'px';
 canvas.width=Math.round(width*dpr);
 canvas.height=Math.round(naturalHeight*dpr);
 const ctx=canvas.getContext('2d',{alpha:false});
 const ratio=canvas.width/1024;
 ctx.setTransform(ratio,0,0,ratio,0,0);
 ctx.imageSmoothingEnabled=true;
 ctx.imageSmoothingQuality='high';
 const {gaps,mappedY}=frisGeometry(designHeight);
 let previous=0;
 let target=0;
 for(let i=0;i<=frisStops.length;i++){
   const next=i<frisStops.length?frisStops[i]:1536;
   const segment=next-previous;
   // Original header, text, icons, cafe and navigation are all rendered 1:1.
   ctx.drawImage(frisArt,0,previous,1024,segment,0,target,1024,segment);
   target+=segment;
   if(i<frisStops.length){
     // Only repeat the unobtrusive paper texture bordering a row.
     const gap=gaps[i];
     const stop=frisStops[i];
     const stripe=14;
     for(let y=0;y<gap;y+=stripe){
       const height=Math.min(stripe,gap-y);
       const cycle=Math.floor(y/stripe)%2;
       const source=cycle?stop-7:stop-7;
       ctx.save();
       if(cycle){
         ctx.translate(0,target+y+height);
         ctx.scale(1,-1);
         ctx.drawImage(frisArt,0,source,1024,7,0,0,1024,height);
       }else{
         ctx.drawImage(frisArt,0,source,1024,7,0,target+y,1024,height);
       }
       ctx.restore();
     }
     target+=gap;
   }
   previous=next;
 }
 shell.querySelectorAll('[data-art-top]').forEach(btn=>{
   const top=mappedY(+btn.dataset.artTop);
   const bottom=mappedY(+btn.dataset.artBottom);
   btn.style.top=top/designHeight*100+'%';
   btn.style.height=(bottom-top)/designHeight*100+'%';
 });
}
window.addEventListener('resize',()=>requestAnimationFrame(drawHomeCanvas));
window.addEventListener('orientationchange',()=>requestAnimationFrame(drawHomeCanvas));


// Optie B: main artwork is drawn at its original aspect ratio. Only quiet separator bands expand.
// Precisely render the approved Optie B image at the original aspect ratio.
// Only blank watercolor intervals may grow on taller screens, never text or illustrations.
const frisBArt=new Image();
frisBArt.src='../art/fris-b-goedgekeurd.webp';
frisBArt.addEventListener('load',()=>requestAnimationFrame(drawBHome));
const frisApprovedBands=[[414,454,0.15],[674,689,0.2],[895,919,0.2],[1122,1210,0.45]].map(([start,end,share])=>({start,end,share}));
function drawBHome(){
 const canvas=document.getElementById('fris-b-canvas');
 if(!canvas||!frisBArt.complete||!frisBArt.naturalWidth)return;
 const shell=canvas.closest('.fris-b-composition');
 if(!shell)return;
 const viewportW=shell.clientWidth,viewportH=shell.clientHeight;
 if(viewportW<1||viewportH<1)return;
 const imageW=941,imageH=1672;
 const scale=Math.min(viewportW/imageW,viewportH/imageH);
 const imageLeft=(viewportW-imageW*scale)/2;
 const extra=Math.max(0,viewportH/scale-imageH);
 const dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.width=Math.round(viewportW*dpr);
 canvas.height=Math.round(viewportH*dpr);
 const ctx=canvas.getContext('2d',{alpha:false});
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.fillStyle='#fff8ef';ctx.fillRect(0,0,viewportW,viewportH);
 ctx.translate(imageLeft,0);ctx.scale(scale,scale);
 ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
 let source=0,dest=0;
 for(const band of frisApprovedBands){
   const unchanged=band.start-source;
   if(unchanged>0){ctx.drawImage(frisBArt,0,source,imageW,unchanged,0,dest,imageW,unchanged);dest+=unchanged;}
   const portion=band.end-band.start;
   const grown=portion+extra*band.share;
   ctx.drawImage(frisBArt,0,band.start,imageW,portion,0,dest,imageW,grown);
   dest+=grown;source=band.end;
 }
 if(source<imageH){ctx.drawImage(frisBArt,0,source,imageW,imageH-source,0,dest,imageW,imageH-source);}
 const mapY=y=>{
   let offset=y;
   for(const band of frisApprovedBands){
     if(y>=band.end)offset+=extra*band.share;
     else if(y>band.start)offset+=extra*band.share*(y-band.start)/(band.end-band.start);
   }
   return offset;
 };

 // Canvas lettering is drawn only over a verified text-free copy of the original image.
 ctx.save();ctx.textAlign='left';ctx.textBaseline='alphabetic';
 ctx.fillStyle='#223c51';ctx.font='700 47px "Manrope", Arial, sans-serif';
 [["Lessen",418,530],["Oefenen",418,759],["Herhaling",418,987]].forEach(([t,x,y])=>ctx.fillText(t,x,mapY(y)));
 ctx.fillStyle='#394957';ctx.font='400 27px "Manrope", Arial, sans-serif';
 [["Nieuwe stof leren en",418,575],["begrijpen.",418,609],["Direct aan de slag met",418,803],["de stof.",418,837],["Eerder geleerde stof",418,1034],["opfrissen.",418,1070]].forEach(([t,x,y])=>ctx.fillText(t,x,mapY(y)));
 ctx.textAlign='center';ctx.fillStyle='#223c51';ctx.font='600 24px "Manrope", Arial, sans-serif';
 [["Home",129,1604],["Theorie",351,1604],["Voortgang",586,1604],["Instellingen",812,1604]].forEach(([t,x,y])=>ctx.fillText(t,x,mapY(y)));
 ctx.restore();
 shell.querySelectorAll('[data-b-top]').forEach(btn=>{
  const top=mapY(Number(btn.dataset.bTop));
  const bottom=mapY(Number(btn.dataset.bBottom));
  const x=Number(btn.dataset.bX||0);
  const w=Number(btn.dataset.bW||imageW);
  btn.style.top=(top*scale/viewportH*100)+'%';
  btn.style.height=((bottom-top)*scale/viewportH*100)+'%';
  btn.style.left=((imageLeft+x*scale)/viewportW*100)+'%';
  btn.style.width=(w*scale/viewportW*100)+'%';
 });
}
window.addEventListener('resize',()=>requestAnimationFrame(drawBHome));
window.addEventListener('orientationchange',()=>requestAnimationFrame(drawBHome));
// Await exact webfont before re-painting editable menu and navigation labels.
Promise.all([document.fonts.load('700 47px "Manrope"'),document.fonts.load('400 27px "Manrope"'),document.fonts.load('600 24px "Manrope"')]).then(()=>requestAnimationFrame(drawBHome)).catch(()=>{});


function render(){
const areaKey=['home','skills','setup','started','lessons'].includes(state.screen)?'home':state.screen;
document.querySelector('.nav').classList.toggle('on-home',state.screen==='home');
document.querySelectorAll('[data-nav]').forEach(b=>{b.classList.toggle('active',areaKey===b.dataset.nav); b.setAttribute('aria-current',areaKey===b.dataset.nav?'page':'false')});
if(state.screen==='home'){content.innerHTML=`<div class="fris-b-composition" aria-label="FRIS! goedgekeurde optie B"><canvas id="fris-b-canvas" role="img" aria-label="Goedgekeurde FRIS! optie B illustratie met navigatie"></canvas>
<button class="fris-b-tap" type="button" data-go="lessons" data-b-top="456" data-b-bottom="654" data-b-x="50" data-b-w="841" aria-label="Lessen openen"></button>
<button class="fris-b-tap" type="button" data-go="skills" data-b-top="689" data-b-bottom="889" data-b-x="50" data-b-w="841" aria-label="Oefenen openen"></button>
<button class="fris-b-tap" type="button" data-go="review" data-b-top="920" data-b-bottom="1122" data-b-x="50" data-b-w="841" aria-label="Herhaling openen"></button>
<button class="fris-b-tap" type="button" data-nav="home" data-b-top="1478" data-b-bottom="1672" data-b-x="0.00" data-b-w="235.25" aria-label="Home"></button>
<button class="fris-b-tap" type="button" data-nav="theory" data-b-top="1478" data-b-bottom="1672" data-b-x="235.25" data-b-w="235.25" aria-label="Theorie"></button>
<button class="fris-b-tap" type="button" data-nav="progress" data-b-top="1478" data-b-bottom="1672" data-b-x="470.50" data-b-w="235.25" aria-label="Voortgang"></button>
<button class="fris-b-tap" type="button" data-nav="settings" data-b-top="1478" data-b-bottom="1672" data-b-x="705.75" data-b-w="235.25" aria-label="Instellingen"></button>`;requestAnimationFrame(drawBHome);}
else if(state.screen==='skills'){content.innerHTML=`<div class="page-inner"><h1>Oefenen</h1>${skills.map(([s,ic])=>`<button class="skill" data-skill="${esc(s)}"><span class="symbol">${skillIcon(ic)}</span>${esc(s)}<span class="chev">›</span></button>`).join('')}</div>`;}
else if(state.screen==='setup'){
const s=state.skill,cfg=config[s];
const first=s==='Spreken'?select('category','Situatie',cfg.items,state.category):select('choice',cfg.label,cfg.items,state.choices[s]);
const second=s==='Spreken'&&state.category!=='Alle situaties'?select('situation','Specifieke situatie',situations[state.category]||['Alle situaties'],state.situation):'';
content.innerHTML=`<div class="page-inner"><h1>${esc(s)}</h1>${first}${second}${settings()}<button class="primary" id="start">Start oefenen →</button></div>`;
}
else if(state.screen==='started'){content.innerHTML=`<div class="page-inner"><h1>Oefening</h1>${example()}<button class="primary" data-back="setup">Keuzes aanpassen</button></div>`;}
else if(['theory','vocabulary','review','lessons'].includes(state.screen)){const names={theory:'Theorie',vocabulary:'Woordenschat',review:'Herhaling',lessons:'Lessen'};content.innerHTML=`<div class="page-inner"><h1>${names[state.screen]}</h1><p class="note">Dit is een klikbaar navigatievoorbeeld. De lessen en oefeningen komen uit het afzonderlijke Android-project.</p>${state.screen==='lessons'?'<button class="primary" data-go="skills">Naar oefeningen</button>':''}</div>`;}
else if(state.screen==='progress'){content.innerHTML=`<div class="page-inner"><h1>Voortgang</h1><p class="note">De 9% op het startscherm is een voorbeeld uit het ontwerp. Er zijn in deze HTML-preview nog geen echte oefenresultaten.</p></div>`;}
else if(state.screen==='settings'){content.innerHTML=`<div class="page-inner"><h1>Instellingen</h1><p class="note">Je oefenkeuzes worden bewaard in deze browser.</p></div>`;}
if(state.screen!=='home'){
 const title=content.querySelector('.page-inner h1');
 if(title){
   const extra={
     lessons:['Nieuwe stof leren en begrijpen.','../art/2026-home-lessons.webp'],
     skills:['Kies wat je wilt oefenen.','../art/2026-home-practice.webp'],
     setup:['Oefen gericht in jouw tempo.','../art/2026-home-practice.webp'],
     started:['Je gekozen oefening.','../art/2026-home-practice.webp'],
     review:['Eerder geleerde stof opfrissen.','../art/2026-home-review.webp'],
     theory:['Uitleg en overzicht.','../art/2026-home-lessons.webp'],
     progress:['Jouw ontwikkeling in beeld.','../art/2026-home-review.webp'],
     settings:['Stel FRIS! naar wens in.','../art/2026-home-lessons.webp']
   };
   const [subtitle,picture]=extra[state.screen]||['','../art/2026-home-lessons.webp'];
   const intro=document.createElement('div');
   intro.className='fris-inner-intro';
   const art=document.createElement('img');
   art.src=picture;art.alt='';art.setAttribute('aria-hidden','true');
   const texts=document.createElement('div');texts.className='fris-inner-title';
   title.before(intro);intro.append(art,texts);texts.appendChild(title);
   if(subtitle){const sub=document.createElement('p');sub.textContent=subtitle;texts.appendChild(sub);}
 }
}
persist();
}
document.addEventListener('click',ev=>{
const go=ev.target.closest('[data-go]');if(go){state.screen=go.dataset.go;render();return}
const sk=ev.target.closest('[data-skill]');if(sk){state.skill=sk.dataset.skill;state.screen='setup';state.mode='Automatisch';state.level='Automatisch';state.method='Automatisch';render();return}
const b=ev.target.closest('[data-back]');if(b){state.screen=b.dataset.back;render();return}
const nav=ev.target.closest('[data-nav]');if(nav){state.screen=nav.dataset.nav==='home'?'home':nav.dataset.nav;render();return}
if(ev.target.closest('#start')){state.screen='started';render()}
});
document.addEventListener('change',ev=>{
const id=ev.target.id,val=ev.target.value;
if(id==='mode'){state.mode=val;render();return}
if(id==='category'){state.category=val;state.situation='Alle situaties';render();return}
if(id==='situation')state.situation=val;
if(id==='choice')state.choices[state.skill]=val;
if(id==='level')state.level=val;
if(id==='method')state.method=val;
if(ev.target.dataset.included){const name=ev.target.dataset.included;if(ev.target.checked){if(!state.selectedSkills.includes(name))state.selectedSkills.push(name)}else if(state.selectedSkills.length>1){state.selectedSkills=state.selectedSkills.filter(s=>s!==name)}else{ev.target.checked=true} }
persist();
});
render();
})();
</script>
