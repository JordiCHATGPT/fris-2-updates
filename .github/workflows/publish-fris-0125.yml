name: Publish FRIS 0.1.25
on:
  push:
    paths:
      - .github/workflows/publish-fris-0125.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Android build
        env:
          ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-b06c-81f4-8f7f-3d0291283bfc/raw?se=2026-11-23T13%3A34%3A53Z&sp=r&sv=2026-06-06&sr=b&scid=3cba386b-0a32-5bef-91c6-e2aec3259f0c&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-23T09%3A26%3A49Z&ske=2026-11-24T09%3A26%3A49Z&sks=b&skv=2026-06-06&sig=mDX6HKjgDiqKsyUsNDvQgOrUZzTcVssEdqaMlxH6gG0%3D'
        run: |
          curl -fLsS --retry 3 --max-time 180 "$ARTIFACT_URL" -o artifact.zip
          unzip -o artifact.zip app-debug.apk
          mkdir -p downloads
          mv app-debug.apk downloads/fris-2.0-v0.1.25-dev.apk
          test $(wc -c < downloads/fris-2.0-v0.1.25-dev.apk) -eq 13105216
          echo "98649b76df6080a7e918f032e3957666cc5c055bd671c1bebf3001173a89e079  downloads/fris-2.0-v0.1.25-dev.apk" | sha256sum -c -
          rm artifact.zip
      - name: Publish metadata and APK
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('update.json').write_text(json.dumps({
            'versionCode': 26,
            'versionName': '0.1.25-dev',
            'downloadUrl': 'https://raw.githubusercontent.com/JordiCHATGPT/fris-2-updates/main/downloads/fris-2.0-v0.1.25-dev.apk',
            'notes': 'Manrope-lettertype consequent op Android en het startscherm toegepast. Geen wijzigingen aan de leerstof.'
          }, indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json downloads/fris-2.0-v0.1.25-dev.apk
          git commit -m "Publish FRIS 0.1.25 Manrope font"
          git push
