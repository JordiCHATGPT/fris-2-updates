name: Publish FRIS 0.1.32
on:
  push:
    paths:
      - .github/workflows/publish-fris-0132.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Android build
        env:
          ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-cd2c-81f4-b671-886b0fe55512/raw?se=2026-11-23T23%3A14%3A06Z&sp=r&sv=2026-06-06&sr=b&scid=ab1d6586-f067-5e43-be3f-a648db79a71a&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-23T07%3A07%3A37Z&ske=2026-11-24T07%3A07%3A37Z&sks=b&skv=2026-06-06&sig=nVWe/3Cjvwnef9ttzU568vEkoLGku%2BBvqsVvLVIIZ4M%3D'
        run: |
          curl -fLsS --retry 3 --max-time 180 "$ARTIFACT_URL" -o artifact.zip
          unzip -o artifact.zip app-debug.apk
          mkdir -p downloads
          mv app-debug.apk downloads/fris-2.0-v0.1.32-dev.apk
          test $(wc -c < downloads/fris-2.0-v0.1.32-dev.apk) -eq 13206852
          echo "7c9a1fd518f5fb704e29d06dbc0aa3e0a6066e6d0ed4582aa1758a51f507f5c1  downloads/fris-2.0-v0.1.32-dev.apk" | sha256sum -c -
          rm artifact.zip
      - name: Publish update metadata and APK
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('update.json').write_text(json.dumps({
            'versionCode': 33,
            'versionName': '0.1.32-dev',
            'downloadUrl': 'https://raw.githubusercontent.com/JordiCHATGPT/fris-2-updates/main/downloads/fris-2.0-v0.1.32-dev.apk',
            'notes': 'Launchericoon gecorrigeerd: net als BIO!logisch rechtstreeks als ronde vector-drawable opgebouwd, zonder vierkante bitmap. Geen wijzigingen aan lessen, herhaling, navigatie of opgeslagen voortgang.'
          }, indent=2, ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json downloads/fris-2.0-v0.1.32-dev.apk
          git commit -m "Publish FRIS 0.1.32 round vector icon"
          git push
