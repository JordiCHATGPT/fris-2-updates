name: Restore FRIS approved illustration elements
on:
  push:
    paths:
      - "scripts/rebuild_art.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow
      - run: python scripts/rebuild_art.py
      - name: Commit reconstructed interface assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/index.html preview/art/
          git diff --cached --quiet || (git commit -m "Restore approved FRIS artwork as separate functional interface assets" && git push)
