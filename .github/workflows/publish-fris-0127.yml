name: Publish FRIS 0.1.27
on:
  push:
    paths:
      - .github/workflows/publish-fris-0127.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download checked Android build
        env:
          ARTIFACT_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-a90c-820a-a5d5-33a7738d4b5e/raw?se=2026-11-23T16%3A32%3A48Z&sp=r&sv=2026-06-06&sr=b&scid=9187c0f4-7906-501c-968f-6503e537bd7d&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-23T07%3A16%3A16Z&ske=2026-11-24T07%3A16%3A16Z&sks=b&skv=2026-06-06&sig=NOg%2Bz1KAnVnw0e8G21C3dmqq2xjQ4WkKNTRF3uOBpVY%3D'
        run: |
          curl -fLsS --retry 3 --max-time 180 "$ARTIFACT_URL" -o artifact.zip
          unzip -o artifact.zip app-debug.apk
          mkdir -p downloads
          mv app-debug.apk downloads/fris-2.0-v0.1.27-dev.apk
          test $(wc -c < downloads/fris-2.0-v0.1.27-dev.apk) -eq 13124566
          echo "e00196f14f4dbe7c14a6832cc98db7d5807eeb04933878137e0ce8c19e44cb37  downloads/fris-2.0-v0.1.27-dev.apk" | sha256sum -c -
          rm artifact.zip
      - name: Publish update metadata and APK
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('update.json').write_text(json.dumps({
            'versionCode': 28,
            'versionName': '0.1.27-dev',
            'downloadUrl': 'https://raw.githubusercontent.com/JordiCHATGPT/fris-2-updates/main/downloads/fris-2.0-v0.1.27-dev.apk',
            'notes': 'Nieuw goedgekeurd FRIS!-appicoon voor Android. In Lessen blijft voortaan maximaal één sectie open. Geen wijzigingen aan lesinhoud, voortgang of afstanden.'
          }, indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json downloads/fris-2.0-v0.1.27-dev.apk
          git commit -m "Publish FRIS 0.1.27 icon and accordion"
          git push
