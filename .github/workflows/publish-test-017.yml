name: Publish FRIS 0.1.7 update test
on:
  push:
    paths:
      - .github/workflows/publish-test-017.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve tested FRIS APK
        env:
          ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-5f90-81f4-b3c4-4c0716df2bb5/raw?se=2026-11-22T17%3A32%3A26Z&sp=r&sv=2026-06-06&sr=b&scid=1970ddce-f78b-5453-a1a7-4561f66fd5d3&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-22T10%3A33%3A48Z&ske=2026-11-23T10%3A33%3A48Z&sks=b&skv=2026-06-06&sig=uUKz9oLAttlr1ZLBLZndUD0a4GShvlsJIfVVePlKgnQ%3D'
        run: |
          curl -fLsS --retry 3 --max-time 180 "$ARTIFACT_URL" -o artifact.zip
          unzip -o artifact.zip app-debug.apk
          mkdir -p downloads
          mv app-debug.apk downloads/fris-2.0-v0.1.7-dev.apk
          test $(wc -c < downloads/fris-2.0-v0.1.7-dev.apk) -gt 1000000
          rm artifact.zip
      - name: Publish new APK and update manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path("update.json").write_text(json.dumps({
            "versionCode": 8,
            "versionName": "0.1.7-dev",
            "downloadUrl": "https://raw.githubusercontent.com/JordiCHATGPT/fris-2-updates/main/downloads/fris-2.0-v0.1.7-dev.apk",
            "notes": "FRIS! updater test: download, verification and install."
          }, indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json downloads/fris-2.0-v0.1.7-dev.apk
          git commit -m "Publish 0.1.7-dev test APK for in-app updater"
          git push
