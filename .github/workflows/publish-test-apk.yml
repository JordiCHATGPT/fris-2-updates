name: Publish FRIS test APK
on:
  push:
    paths:
      - .github/workflows/publish-test-apk.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve current tested APK
        env:
          ARTIFACT_ZIP_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-73c0-81f4-a24e-7062b3211666/raw?se=2026-11-22T17%3A12%3A11Z&sp=r&sv=2026-06-06&sr=b&scid=1e1b85dd-b789-5de7-b326-7f819db2f9c3&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-22T15%3A02%3A27Z&ske=2026-11-23T15%3A02%3A27Z&sks=b&skv=2026-06-06&sig=/8vZ6jDAUIF0TTFWjyacec8OwtW5i4tY%2B/mTM9K3Z5s%3D'
        run: |
          curl -fLsS --retry 3 --max-time 150 "$ARTIFACT_ZIP_URL" -o artifact.zip
          unzip -o artifact.zip app-debug.apk
          mkdir -p downloads
          mv app-debug.apk downloads/fris-2.0-v0.1.3-dev.apk
          test $(wc -c < downloads/fris-2.0-v0.1.3-dev.apk) -gt 1000000
          rm artifact.zip
      - name: Publish APK and update manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('update.json').write_text(json.dumps({
              'versionCode': 4,
              'versionName': '0.1.3-dev',
              'downloadUrl': 'https://raw.githubusercontent.com/JordiCHATGPT/fris-2-updates/main/downloads/fris-2.0-v0.1.3-dev.apk',
              'notes': 'Volledige FRIS!-header op binnenpagina’s.'
          }, indent=2) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json downloads/fris-2.0-v0.1.3-dev.apk
          git commit -m "Publish 0.1.3-dev update APK"
          git push
