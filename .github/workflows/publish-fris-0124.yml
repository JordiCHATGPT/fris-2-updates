name: Publish FRIS 0.1.24
on:
  push:
    paths:
      - .github/workflows/publish-fris-0124.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified build
        env:
          ARTIFACT_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-cd74-8210-ae61-f51858cfb4e1/raw?se=2026-11-23T13%3A05%3A49Z&sp=r&sv=2026-06-06&sr=b&scid=ea05278f-552b-50ee-a370-d45174e7072e&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-23T07%3A08%3A33Z&ske=2026-11-24T07%3A08%3A33Z&sks=b&skv=2026-06-06&sig=P3UUqr9c8rqmpL8T18GW4%2BuNZZbvPCyzwxElN3Xnvfc%3D'
        run: |
          curl -fLsS --retry 3 --max-time 180 "$ARTIFACT_URL" -o artifact.zip
          unzip -o artifact.zip app-debug.apk
          mkdir -p downloads
          mv app-debug.apk downloads/fris-2.0-v0.1.24-dev.apk
          test $(wc -c < downloads/fris-2.0-v0.1.24-dev.apk) -gt 1000000
          rm artifact.zip
      - name: Publish metadata and APK
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('update.json').write_text(json.dumps({
            'versionCode': 25,
            'versionName': '0.1.24-dev',
            'downloadUrl': 'https://raw.githubusercontent.com/JordiCHATGPT/fris-2-updates/main/downloads/fris-2.0-v0.1.24-dev.apk',
            'notes': 'Gemengd oefenen over alle onderwerpen op hetzelfde niveau, met opslag van voortgang bij het oorspronkelijke onderwerp. Extra A2-grammatica toegevoegd.'
          }, indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json downloads/fris-2.0-v0.1.24-dev.apk
          git commit -m "Publish FRIS 0.1.24 mixed practice"
          git push
