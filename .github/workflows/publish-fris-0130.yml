name: Publish FRIS 0.1.30
on:
  push:
    paths:
      - .github/workflows/publish-fris-0130.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Android build
        env:
          ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-4940-81f4-8162-02ca0d7a0ca9/raw?se=2026-11-23T22%3A18%3A00Z&sp=r&sv=2026-06-06&sr=b&scid=0e750c57-833f-5242-a18c-068f12de4997&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-23T06%3A45%3A49Z&ske=2026-11-24T06%3A45%3A49Z&sks=b&skv=2026-06-06&sig=LygZKl3h4dAh4E17R03QOT0Ix5o47IVpyRK09J%2BmeFQ%3D'
        run: |
          curl -fLsS --retry 3 --max-time 180 "$ARTIFACT_URL" -o artifact.zip
          unzip -o artifact.zip app-debug.apk
          mkdir -p downloads
          mv app-debug.apk downloads/fris-2.0-v0.1.30-dev.apk
          test $(wc -c < downloads/fris-2.0-v0.1.30-dev.apk) -eq 13190155
          echo "dbac8aecc09c22a0c905b01ca6b66b527bd92dc1502c576a630999bbb0145e87  downloads/fris-2.0-v0.1.30-dev.apk" | sha256sum -c -
          rm artifact.zip
      - name: Publish update metadata and APK
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('update.json').write_text(json.dumps({
            'versionCode': 31,
            'versionName': '0.1.30-dev',
            'downloadUrl': 'https://raw.githubusercontent.com/JordiCHATGPT/fris-2-updates/main/downloads/fris-2.0-v0.1.30-dev.apk',
            'notes': 'Uniforme subpaginastijl: centrale FRIS-kleuraccenten, krachtigere kaderranden, consistente afgeronde kaarten en knoppen. Lessen, Luisteren, Theorie, Oefenen, Voortgang en Cursusinhoud verfijnd. Startscherm en lesinhoud behouden.'
          }, indent=2, ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json downloads/fris-2.0-v0.1.30-dev.apk
          git commit -m "Publish FRIS 0.1.30 uniform subpage design"
          git push
