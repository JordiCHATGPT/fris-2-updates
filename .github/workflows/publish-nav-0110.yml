name: Publish FRIS 0.1.10 navigation update
on:
  push:
    paths:
      - .github/workflows/publish-nav-0110.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified GitHub-built FRIS APK
        env:
          ARTIFACT_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-2cd8-8210-affb-9f774969217c/raw?se=2026-11-22T17%3A51%3A24Z&sp=r&sv=2026-06-06&sr=b&scid=d800f4a5-0ca6-501c-80df-a2e806bdc3a8&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-22T07%3A58%3A43Z&ske=2026-11-23T07%3A58%3A43Z&sks=b&skv=2026-06-06&sig=Jcht5QrPVOep%2B53mEthUMLEm2ScmQ0hflWbzZWQsVKc%3D'
        run: |
          curl -fLsS --retry 3 --max-time 180 "$ARTIFACT_URL" -o artifact.zip
          unzip -o artifact.zip app-debug.apk
          mkdir -p downloads
          mv app-debug.apk downloads/fris-2.0-v0.1.10-dev.apk
          test $(wc -c < downloads/fris-2.0-v0.1.10-dev.apk) -gt 1000000
          rm artifact.zip
      - name: Publish APK and update manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('update.json').write_text(json.dumps({
            'versionCode': 11,
            'versionName': '0.1.10-dev',
            'downloadUrl': 'https://raw.githubusercontent.com/JordiCHATGPT/fris-2-updates/main/downloads/fris-2.0-v0.1.10-dev.apk',
            'notes': 'Dezelfde onderste navigatiebalk is nu zichtbaar op alle pagina’s.'
          }, indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json downloads/fris-2.0-v0.1.10-dev.apk
          git commit -m "Publish FRIS 0.1.10 persistent navigation update"
          git push
