name: Publish FRIS 0.1.28
on:
  push:
    paths:
      - .github/workflows/publish-fris-0128.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Android build
        env:
          ARTIFACT_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-ccb4-8210-bd8e-4fcbbd379c63/raw?se=2026-11-23T17%3A22%3A55Z&sp=r&sv=2026-06-06&sr=b&scid=27a89702-0aeb-5bc6-b4e2-e8cb683a5a96&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-23T05%3A20%3A21Z&ske=2026-11-24T05%3A20%3A21Z&sks=b&skv=2026-06-06&sig=KCSNL708p1NTPFMnNA3BWH9oFhBvxnsqJw1%2B7/Swpv0%3D'
        run: |
          curl -fLsS --retry 3 --max-time 180 "$ARTIFACT_URL" -o artifact.zip
          unzip -o artifact.zip app-debug.apk
          mkdir -p downloads
          mv app-debug.apk downloads/fris-2.0-v0.1.28-dev.apk
          test $(wc -c < downloads/fris-2.0-v0.1.28-dev.apk) -eq 13173767
          echo "0bbf010c73d1bd656da136be73738f6e84779d11cc569784f7c31c69ef1ef2f4  downloads/fris-2.0-v0.1.28-dev.apk" | sha256sum -c -
          rm artifact.zip
      - name: Publish update metadata and APK
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('update.json').write_text(json.dumps({
            'versionCode': 29,
            'versionName': '0.1.28-dev',
            'downloadUrl': 'https://raw.githubusercontent.com/JordiCHATGPT/fris-2-updates/main/downloads/fris-2.0-v0.1.28-dev.apk',
            'notes': 'Grote inhoudsuitbreiding: 20 nieuwe lesmodules, 384 nieuwe grammatica- en schrijfoefeningen, 48 leesbegripsvragen en 16 extra luisterteksten met 48 luistervragen. Alle A1-B2 niveaus aangevuld. Bestaande voortgang behouden.'
          }, indent=2, ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json downloads/fris-2.0-v0.1.28-dev.apk
          git commit -m "Publish FRIS 0.1.28 expanded course"
          git push
