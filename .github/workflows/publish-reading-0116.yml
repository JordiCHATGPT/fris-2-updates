name: Publish FRIS 0.1.16 higher-level reading
on:
  push:
    paths:
      - .github/workflows/publish-reading-0116.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download tested FRIS APK
        env:
          ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-bea0-81f4-bf83-bf2e78be5f1d/raw?se=2026-11-22T19%3A44%3A40Z&sp=r&sv=2026-06-06&sr=b&scid=9216d346-eae7-55d7-ba37-91b99384c136&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-22T16%3A37%3A52Z&ske=2026-11-23T16%3A37%3A52Z&sks=b&skv=2026-06-06&sig=kwcb9KiSdXRL8ONYby7FRciVi4yKE39Ofkg4rzljfto%3D'
        run: |
          curl -fLsS --retry 3 --max-time 180 "$ARTIFACT_URL" -o artifact.zip
          unzip -o artifact.zip app-debug.apk
          mkdir -p downloads
          mv app-debug.apk downloads/fris-2.0-v0.1.16-dev.apk
          test $(wc -c < downloads/fris-2.0-v0.1.16-dev.apk) -gt 1000000
          rm artifact.zip
      - name: Publish APK and in-app update manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('update.json').write_text(json.dumps({
            'versionCode': 17,
            'versionName': '0.1.16-dev',
            'downloadUrl': 'https://raw.githubusercontent.com/JordiCHATGPT/fris-2-updates/main/downloads/fris-2.0-v0.1.16-dev.apk',
            'notes': 'Nieuwe A2- en B1-leesteksten: 12 originele Duitse teksten, 36 begripsvragen en Nederlandse feedback.'
          }, indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json downloads/fris-2.0-v0.1.16-dev.apk
          git commit -m "Publish FRIS 0.1.16 A2/B1 German reading comprehension"
          git push
