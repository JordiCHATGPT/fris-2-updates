name: Publish FRIS 0.1.5 test update
on:
  push:
    paths:
      - .github/workflows/publish-015.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve tested app
        env:
          ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-a48c-81f4-bbe5-3b79c92f1043/raw?se=2026-11-22T17%3A25%3A09Z&sp=r&sv=2026-06-06&sr=b&scid=83ba360a-e585-59af-9085-dd3e7b780d4d&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-22T08%3A08%3A44Z&ske=2026-11-23T08%3A08%3A44Z&sks=b&skv=2026-06-06&sig=YTGYsdEF5pGhiRB54CwwItM9wLKNZAgUlMnLmH01Snk%3D'
        run: |
          curl -fLsS --retry 3 --max-time 150 "$ARTIFACT_URL" -o artifact.zip
          unzip -o artifact.zip app-debug.apk
          mkdir -p downloads
          mv app-debug.apk downloads/fris-2.0-v0.1.5-dev.apk
          test $(wc -c < downloads/fris-2.0-v0.1.5-dev.apk) -gt 1000000
          rm artifact.zip
      - name: Publish update
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path("update.json").write_text(json.dumps({
            "versionCode": 6,
            "versionName": "0.1.5-dev",
            "downloadUrl": "https://raw.githubusercontent.com/JordiCHATGPT/fris-2-updates/main/downloads/fris-2.0-v0.1.5-dev.apk",
            "notes": "Test van de in-app APK-updater"
          }, indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json downloads/fris-2.0-v0.1.5-dev.apk
          git commit -m "Publish 0.1.5-dev in-app test update"
          git push
