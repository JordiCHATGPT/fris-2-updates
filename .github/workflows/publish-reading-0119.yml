name: Publish FRIS 0.1.19 theory readability
on:
  push:
    paths:
      - .github/workflows/publish-reading-0119.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download validated APK
        env:
          ARTIFACT_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-613c-8210-acab-9eddd213bdeb/raw?se=2026-11-22T20%3A15%3A30Z&sp=r&sv=2026-06-06&sr=b&scid=8c561cb7-1782-5f9f-a5a4-62b34b6991e1&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-22T15%3A48%3A43Z&ske=2026-11-23T15%3A48%3A43Z&sks=b&skv=2026-06-06&sig=CMYOybuRHTH2FMh/3Q6y4ZRdZyuWmvY2Dhgm/kkWVA8%3D'
        run: |
          curl -fLsS --retry 3 --max-time 180 "$ARTIFACT_URL" -o artifact.zip
          unzip -o artifact.zip app-debug.apk
          mkdir -p downloads
          mv app-debug.apk downloads/fris-2.0-v0.1.19-dev.apk
          test $(wc -c < downloads/fris-2.0-v0.1.19-dev.apk) -gt 1000000
          rm artifact.zip
      - name: Publish update manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('update.json').write_text(json.dumps({
            'versionCode': 20,
            'versionName': '0.1.19-dev',
            'downloadUrl': 'https://raw.githubusercontent.com/JordiCHATGPT/fris-2-updates/main/downloads/fris-2.0-v0.1.19-dev.apk',
            'notes': 'Compacte theorie: fijnere tekst, betere regelafstand, nette opsommingen en rustigere voorbeeldkaders.'
          },indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json downloads/fris-2.0-v0.1.19-dev.apk
          git commit -m "Publish FRIS 0.1.19 refined theory typography"
          git push
