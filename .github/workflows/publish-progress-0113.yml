name: Publish FRIS 0.1.13 progress dashboard
on:
  push:
    paths:
      - .github/workflows/publish-progress-0113.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch completed Android artifact
        env:
          ARTIFACT_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-8e6c-8243-b101-1b5aec3f107c/raw?se=2026-11-22T18%3A23%3A49Z&sp=r&sv=2026-06-06&sr=b&scid=4620d538-dc65-57f0-bad1-4b2e2ae86110&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-22T03%3A07%3A08Z&ske=2026-11-23T03%3A07%3A08Z&sks=b&skv=2026-06-06&sig=jhS4OSibqVCdy48kFWmTTvc1mCAAMblug1ofjglc0uw%3D'
        run: |
          curl -fLsS --retry 3 --max-time 180 "$ARTIFACT_URL" -o artifact.zip
          unzip -o artifact.zip app-debug.apk
          mkdir -p downloads
          mv app-debug.apk downloads/fris-2.0-v0.1.13-dev.apk
          test $(wc -c < downloads/fris-2.0-v0.1.13-dev.apk) -gt 1000000
          rm artifact.zip
      - name: Publish and set in-app update
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('update.json').write_text(json.dumps({
            'versionCode': 14,
            'versionName': '0.1.13-dev',
            'downloadUrl': 'https://raw.githubusercontent.com/JordiCHATGPT/fris-2-updates/main/downloads/fris-2.0-v0.1.13-dev.apk',
            'notes': 'Nieuwe grafische voortgang: beantwoorde vragen, resultaten, herhaling en voortgangsbalken. Terugknop verwijderd.'
          }, indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json downloads/fris-2.0-v0.1.13-dev.apk
          git commit -m "Publish FRIS 0.1.13 visual progress dashboard"
          git push
